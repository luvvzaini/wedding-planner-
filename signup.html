<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join DreamWed | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bistre: #210100; --goldfinch: #E6A341; --butter: #FECE79; --garnet: #8C0902; }
        body, html { height: 100%; margin: 0; font-family: 'Georgia', serif; overflow: hidden; }

        
        
    
body {
    background-color: #fffaf5; /* cream color */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
}

/* Border/Frame for the video */
.video-frame {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85vw; /*border on the sides */
    height: 85vh; /* border on top/bottom */
    border: 15px solid white; /* thick white border */
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    z-index: -1;
}

/* The Video inside the frame */
.bg-video {
    width: 100%;
    height: 100%;
    object-fit: cover; 
    filter: brightness(0.8);
}

        
        .signup-container {
    background: rgba(255, 250, 245, 0.85); /* 85% opacity cream */
    backdrop-filter: blur(12px); /* "Glass" effect */
    border-radius: 50px;
    padding: 60px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    border: 1px solid rgba(230, 163, 65, 0.2);
    max-width: 450px;
    width: 95%;
}
       

        .form-control {
            border: none;
            border-bottom: 2px solid var(--butter);
            background: transparent;
            border-radius: 0;
            padding: 12px 5px;
            margin-bottom: 25px;
        }

        .form-control:focus {
            box-shadow: none;
            border-bottom-color: var(--goldfinch);
            background: transparent;
        }

        .btn-signup {
            background: var(--garnet);
            color: white;
            border-radius: 50px;
            padding: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-signup:hover { background: var(--bistre); transform: scale(1.02); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="background-color: #fffaf5; min-height: 100vh; margin: 0;">

    <div class="position-relative d-flex align-items-center justify-content-center" style="width: 90vw; height: 85vh;">
        
        <div class="position-absolute top-0 start-0 w-100 h-100 shadow-lg" style="border: 12px solid white; border-radius: 50px; overflow: hidden; z-index: 1;">
            <video autoplay muted loop style="width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65);">
                <source src="0223.mp4" type="video/mp4">
            </video>
        </div>

        <div class="signup-container text-center position-relative" style="z-index: 2; background: rgba(255, 250, 245, 0.9); backdrop-filter: blur(10px); border-radius: 40px; padding: 40px; max-width: 450px; width: 90%; box-shadow: 0 15px 35px rgba(0,0,0,0.2);">
            <h2 class="fw-bold mb-2" style="color: #8C0902; font-family: 'Georgia', serif;">Start Your Journey</h2>
            <p class="text-muted small fst-italic mb-4">Create an account to save your dream wedding details</p>

            <form>
                <input type="text" class="form-control mb-3" placeholder="Full Name" style="background: transparent; border: none; border-bottom: 2px solid #FECE79;">
                <input type="email" class="form-control mb-3" placeholder="Email Address" style="background: transparent; border: none; border-bottom: 2px solid #FECE79;">
                <input type="password" class="form-control mb-4" placeholder="Create Password" style="background: transparent; border: none; border-bottom: 2px solid #FECE79;">
                
                <button type="submit" class="btn w-100" style="background-color: #8C0902; color: white; border-radius: 50px; padding: 12px; font-weight: bold;">Join the Magic</button>
            </form>

            
            
            <a href="wedding planner.html" class="d-block mt-3 small text-muted" style="text-decoration: none;">← Back to Home</a>
        </div>

    </div>
    <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        
        const container = document.querySelector('.signup-container');
        
        
        container.innerHTML = `
            <div style="padding: 20px; animation: fadeIn 1s ease;">
                <h1 style="font-size: 50px; color: #E6A341;">✨</h1>
                <h2 style="color: #8C0902; font-family: 'Georgia', serif; font-weight: bold;">Welcome to the Family!</h2>
                <p class="text-muted fst-italic mt-3">Your account has been created successfully. Your magical wedding journey starts now.</p>
                <hr style="border-color: #FECE79; margin: 25px 0;">
                <a href="wedding planner.html" class="btn w-100" style="background-color: #8C0902; color: white; border-radius: 50px; padding: 12px; font-weight: bold; text-decoration: none; display: inline-block;">Explore Your Dashboard</a>
            </div>
        `;
    });
</script>

</body>
</html>
